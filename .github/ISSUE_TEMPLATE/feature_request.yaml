name: Feature request
description: Suggest an idea for this project
title: "feat: "
type: Feature
projects: ["versat-labs/1"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: A clear and concise description of what the problem is.
      placeholder: "Example: I'm always frustrated when [...]"
    validations:
      required: true

  - type: textarea
    id: job-to-be-done
    attributes:
      label: Job To Be Done
      placeholder: |
        WHEN ...
        I WANT ...
        SO THAT I CAN ...
    validations:
      required: true

  - type: textarea
    id: persona
    attributes:
      label: Persona
      placeholder: |
        User persona:
        Buyer persona:
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
